# SPDX-License-Identifier: GPL-3.0-or-later
# Publish only after actual packaged V2 read-only media and corruption tests.
# Full BOOT/OVMF handoff remains a separate qualification, not a release claim.
name: Qualify XFS Common V2 read-only hosted and firmware packages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential binutils cmake git pkg-config libssl-dev libsqlite3-dev xfsprogs dpkg-dev cpio busybox-static qemu-system-x86 seabios zstd
      - name: Qualify portable Common V2 package only
        run: |
          set -euo pipefail
          python3 standalone/release.py release
          python3 standalone/check-package.py dist/*.deb --profile portable
          test "$(find dist -maxdepth 1 -name '*.deb' | wc -l)" = 1
          test "$(find dist -maxdepth 1 -name '*.run' | wc -l)" = 1
          test "$(find dist -maxdepth 1 -name '*.ko' | wc -l)" = 0
          mkdir -p "$RUNNER_TEMP/portable"
          dpkg-deb -x dist/*.deb "$RUNNER_TEMP/portable"
          test "$(find "$RUNNER_TEMP/portable" -type f | wc -l)" = 2
          sh tests/check_v2_exports.sh "$RUNNER_TEMP/portable/System/Filesystems/XFS.so"
      - name: Qualify CPU-native RUN payload
        run: |
          set -euo pipefail
          run="$(find dist -maxdepth 1 -name '*.run' -print -quit)"
          bash "$run" --profile aggressive --system-package-mode --build-only --output "$RUNNER_TEMP/native"
          deb="$(find "$RUNNER_TEMP/native" -maxdepth 1 -name '*.deb' -print -quit)"
          test -s "$deb"
          python3 standalone/check-package.py "$deb" --profile aggressive
          mkdir -p "$RUNNER_TEMP/native-root"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/native-root"
          test "$(find "$RUNNER_TEMP/native-root" -type f | wc -l)" = 2
          sh tests/check_v2_exports.sh "$RUNNER_TEMP/native-root/System/Filesystems/XFS.so"
      - name: Exercise XFS file reads and on-disk corruption through both package binaries
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/Infiltrator-Projects/Libraries "$RUNNER_TEMP/common-xfs"
          git -C "$RUNNER_TEMP/common-xfs" checkout --quiet d23a52693fd3212368d327e1c1302e07ae9510ec
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -I"$RUNNER_TEMP/common-xfs/include" tests/test_superblock_media.c -ldl -o "$RUNNER_TEMP/test-xfs"
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -I"$RUNNER_TEMP/common-xfs/include" tests/test_namespace_media.c -ldl -o "$RUNNER_TEMP/read-xfs"
          bootfiles="$RUNNER_TEMP/xfs-boot-files"
          bash tests/boot-file-fixtures.sh "$bootfiles"
          export TEST_KERNEL="$bootfiles/vmlinuz" TEST_INITRAMFS="$bootfiles/initramfs"
          release=$(basename "$(find "$bootfiles/download/kernel/boot" -name 'vmlinuz-*' -print -quit)")
          release=${release#vmlinuz-}
          (cd "$bootfiles/download" && apt-get download "linux-modules-$release" "linux-modules-extra-$release")
          for deb in "$bootfiles/download"/linux-modules*.deb; do dpkg-deb -x "$deb" "$bootfiles/download/kernel"; done
          modtree=$(find "$bootfiles/download/kernel" -type d -path "*/modules/$release" -print -quit)
          test -n "$modtree"
          fixtures="$RUNNER_TEMP/xfs-used"
          bash tests/fragmented-media.sh "$TEST_KERNEL" "$modtree" "$fixtures"
          (cd "$fixtures" && sha256sum fragmented.img dirty-log.img bad-bmap.img > images.sha256)
          for profile in portable native-root; do
            bash tests/superblock-media.sh "$RUNNER_TEMP/test-xfs" "$RUNNER_TEMP/$profile/System/Filesystems/XFS.so"
            module="$RUNNER_TEMP/$profile/System/Filesystems/XFS.so"
            bash tests/namespace-media.sh "$RUNNER_TEMP/read-xfs" "$module"
            objcopy --dump-section ".infiltrator_boot=$RUNNER_TEMP/$profile.elf" "$module" "$RUNNER_TEMP/$profile.copy"
            for binary in "$module" "$RUNNER_TEMP/$profile.elf"; do
              for mode in fragmented dirty-log bad-bmap; do
                "$RUNNER_TEMP/read-xfs" "$binary" "$fixtures/$mode.img" - 4096 "$mode"
              done
            done
          done
          (cd "$fixtures" && sha256sum -c images.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: XFS-v2-read-only-packages
          path: dist/*
          if-no-files-found: error
  publish:
    needs: qualify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: XFS-v2-read-only-packages
          path: dist
      - name: Publish qualified V2 packages without kernel substitutes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          version="$(tr -d '\r\n' < VERSION)"
          tag="v$version"
          test "$(find dist -maxdepth 1 -name '*.deb' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.run' | wc -l)" -eq 1
          ! find dist -name '*.ko' | grep .
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Immutable existing release retained; bump VERSION before next release"
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "Tag exists without a verified release; refuse to overwrite" >&2
            exit 1
          fi
          (cd dist && sha256sum -- *.deb *.run > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          gh release create "$tag" dist/*.deb dist/*.run dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "XFS native Common V2 filesystem reader $version" \
            --notes "V2-only XFS.so with embedded freestanding read-only reader; portable DEB and native source RUN. Verified packaged namespace, kernel/initramfs, dirty-log and corrupted metadata images. No Linux kernel fallback. Full future BOOT/OVMF integration is not claimed."
          mkdir -p "$RUNNER_TEMP/released"
          gh release download "$tag" --dir "$RUNNER_TEMP/released"
          (cd "$RUNNER_TEMP/released" && sha256sum -c SHA256SUMS.txt)
