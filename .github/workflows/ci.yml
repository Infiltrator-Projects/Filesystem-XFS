# SPDX-License-Identifier: GPL-3.0-or-later
name: Qualify XFS Common V2 hosted and firmware geometry
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  xfs-hosted:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install full source-owned regression test prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake git libssl-dev libsqlite3-dev xfsprogs
      - name: Build production V2 provider and historical parser regressions
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          sh tests/check_v2_exports.sh build/XFS.so
      - name: Inspect canonical installed provider, never Linux KO
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          DESTDIR="$stage" cmake --install build
          test "$(find "$stage" -type f | wc -l)" -eq 2
          cmp build/XFS.so "$stage/System/Filesystems/XFS.so"
          sh tests/check_v2_exports.sh "$stage/System/Filesystems/XFS.so"
          test -s "$stage/System/Resources/Documentation/Filesystem-XFS.pdf"
          test "$(find "$stage" -name '*.ko' | wc -l)" = 0
      - uses: actions/upload-artifact@v4
        with:
          name: XFS-v2-geometry
          path: build/XFS.so
