name: Build independent XFS SO
on:
  push:
    branches: [main]
  pull_request:
jobs:
  xfs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev libsqlite3-dev cmake
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - run: |
          test -f build/XFS.so
          nm -D build/XFS.so | grep infiltrator_filesystem_xfs_v1

      - name: Verify exactly one PDF per runtime SO
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          DESTDIR="$stage" cmake --install build
          test "$(find "$stage" -type f | wc -l)" -eq 2
          test -f "$stage/System/Filesystems/XFS.so"
          test -f "$stage/System/Resources/Documentation/Filesystem-XFS/XFS.pdf"
          test "$(head -c 5 "$stage/System/Resources/Documentation/Filesystem-XFS/XFS.pdf")" = '%PDF-'
